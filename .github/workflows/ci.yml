name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t travel-backend:dev backend
      - run: docker compose -p travel_ci -f docker-compose.test.yml up -d --wait postgres-test redis-test mock-provider
      - run: docker run --rm --network travel_ci_test-internal -e PYTHONPATH=/workspace/backend -e DATABASE_URL=postgresql+psycopg://ignored:ignored@127.0.0.1:9/ignored -e TRAVEL_TEST_DATABASE_URL=postgresql+psycopg://travel:travel@postgres-test:5432/travel_test_ci -e TRAVEL_DISPOSABLE_DB=1 -e TRAVEL_TEST_REDIS_URL=redis://redis-test:6379/15 -e DENY_EXTERNAL_NETWORK=1 -v "$PWD:/workspace" -w /workspace/backend travel-backend:dev sh -lc 'ruff check --no-cache app scripts tests && pytest -q'
      - run: ./scripts/ci/compose-smoke.sh
      - run: ./scripts/ci/check-bridge-compatibility.sh
      - if: always()
        run: docker compose -p travel_ci -f docker-compose.test.yml down -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: NODE_ENV=production npm run build
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/ci/bridge-frontend-matrix.sh
        working-directory: .
  full-stack-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose -p travel_e2e -f docker-compose.test.yml --profile app up -d --build --wait
      - run: FULL_STACK_E2E=1 PLAYWRIGHT_BASE_URL=https://localhost:3443 npx playwright test e2e/critical-journey.spec.ts
        working-directory: frontend
      - if: failure()
        run: docker compose -p travel_e2e -f docker-compose.test.yml --profile app logs --no-color 2>&1 | python3 scripts/ci/sanitize-compose-logs.py
      - if: always()
        run: docker compose -p travel_e2e -f docker-compose.test.yml --profile app down -v --remove-orphans
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: travel, POSTGRES_PASSWORD: travel, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel -d postgres"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t travel-backend:dev backend
      - run: docker run --rm --network host -e TRAVEL_DISPOSABLE_DB=1 -e TRAVEL_TEST_ADMIN_URL=postgresql+psycopg://travel:travel@127.0.0.1:5432/postgres -v "$PWD:/workspace" -w /workspace travel-backend:dev ./scripts/ci/test-migrations.sh
