# Shared environment for backend / worker / beat. Database/Redis URLs are
# required; optional provider keys default to empty strings so collectors
# degrade gracefully until keys are added to .env.
x-backend-env: &backend-env
  - DATABASE_URL=${DATABASE_URL}
  - REDIS_URL=${REDIS_URL}
  - CELERY_BROKER_URL=${CELERY_BROKER_URL}
  - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
  - LOG_LEVEL=${LOG_LEVEL:-INFO}
  - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
  # LLM
  - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
  # Search + content extraction
  - SERPER_API_KEY=${SERPER_API_KEY:-}
  - TAVILY_API_KEY=${TAVILY_API_KEY:-}
  - JINA_AI_ENABLED=${JINA_AI_ENABLED:-true}
  - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
  - FIRECRAWL_BASE_URL=${FIRECRAWL_BASE_URL:-}
  # Platform APIs
  - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
  - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
  - FOURSQUARE_API_KEY=${FOURSQUARE_API_KEY:-}
  - YELP_API_KEY=${YELP_API_KEY:-}
  - BING_SEARCH_API_KEY=${BING_SEARCH_API_KEY:-}
  - TRIPADVISOR_API_KEY=${TRIPADVISOR_API_KEY:-}
  - STAYAPI_API_KEY=${STAYAPI_API_KEY:-}
  - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN:-}
  - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD:-}
  - BOOKING_AFFILIATE_ID=${BOOKING_AFFILIATE_ID:-}
  - AGODA_API_KEY=${AGODA_API_KEY:-}
  # Chinese platforms
  - XIAOHONGSHU_API_KEY=${XIAOHONGSHU_API_KEY:-}
  - XIAOHONGSHU_API_BASE_URL=${XIAOHONGSHU_API_BASE_URL:-}
  - XIAOHONGSHU_API_ENDPOINT=${XIAOHONGSHU_API_ENDPOINT:-}
  - TIKHUB_API_KEY=${TIKHUB_API_KEY:-}
  - TIKHUB_XIAOHONGSHU_ENDPOINT=${TIKHUB_XIAOHONGSHU_ENDPOINT:-}
  - DIANPING_API_KEY=${DIANPING_API_KEY:-}
  - DIANPING_API_BASE_URL=${DIANPING_API_BASE_URL:-}
  - CTRIP_API_KEY=${CTRIP_API_KEY:-}
  - CTRIP_API_BASE_URL=${CTRIP_API_BASE_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: travel-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Exposed on localhost only; the host Nginx proxies travel.umafans.run here.
    ports:
      - "127.0.0.1:8000:8000"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: travel-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app worker -l info -Q celery
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: travel-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app beat -l info
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: travel-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    # Exposed on localhost only; the host Nginx proxies travel.umafans.run here.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

volumes:
  postgres_data:
