# Shared environment for backend / worker / beat. Optional keys default to
# empty strings so collectors degrade gracefully until keys are added to .env.
x-backend-env: &backend-env
  - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://travel:travel@postgres:5432/travel}
  - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
  - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
  - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  - LOG_LEVEL=${LOG_LEVEL:-INFO}
  # LLM
  - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
  # Search + content extraction
  - SERPER_API_KEY=${SERPER_API_KEY:-}
  - TAVILY_API_KEY=${TAVILY_API_KEY:-}
  - JINA_AI_ENABLED=${JINA_AI_ENABLED:-true}
  - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
  - FIRECRAWL_BASE_URL=${FIRECRAWL_BASE_URL:-}
  # Platform APIs
  - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
  - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
  - FOURSQUARE_API_KEY=${FOURSQUARE_API_KEY:-}
  - YELP_API_KEY=${YELP_API_KEY:-}
  - BING_SEARCH_API_KEY=${BING_SEARCH_API_KEY:-}
  - TRIPADVISOR_API_KEY=${TRIPADVISOR_API_KEY:-}
  - STAYAPI_API_KEY=${STAYAPI_API_KEY:-}
  - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN:-}
  - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD:-}
  - BOOKING_AFFILIATE_ID=${BOOKING_AFFILIATE_ID:-}
  - AGODA_API_KEY=${AGODA_API_KEY:-}
  # Chinese platforms
  - XIAOHONGSHU_API_KEY=${XIAOHONGSHU_API_KEY:-}
  - XIAOHONGSHU_API_BASE_URL=${XIAOHONGSHU_API_BASE_URL:-}
  - XIAOHONGSHU_API_ENDPOINT=${XIAOHONGSHU_API_ENDPOINT:-}
  - TIKHUB_API_KEY=${TIKHUB_API_KEY:-}
  - TIKHUB_XIAOHONGSHU_ENDPOINT=${TIKHUB_XIAOHONGSHU_ENDPOINT:-}
  - DIANPING_API_KEY=${DIANPING_API_KEY:-}
  - DIANPING_API_BASE_URL=${DIANPING_API_BASE_URL:-}
  - CTRIP_API_KEY=${CTRIP_API_KEY:-}
  - CTRIP_API_BASE_URL=${CTRIP_API_BASE_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel}
      POSTGRES_DB: ${POSTGRES_DB:-travel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel} -d ${POSTGRES_DB:-travel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -l info -Q celery
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat -l info
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
